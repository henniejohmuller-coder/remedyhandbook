<!DOCTYPE html>
<html style="height:100%">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Evidence-based herbal remedies for natural health and wellness.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Remedy Handbook">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Remedy Handbook</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
    #install-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 44px;
      background: #2C1A00;
      color: #F5C518;
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: sans-serif;
      font-size: 12px;
      z-index: 999999;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }
    #install-bar.hidden { display: none; }
    #install-btn {
      background: #F5C518;
      color: #2C1A00;
      border: none;
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
      margin-left: 8px;
    }
    #close-btn {
      background: none;
      border: none;
      color: #F5C518;
      font-size: 18px;
      cursor: pointer;
      padding: 0 0 0 8px;
      opacity: 0.8;
      line-height: 1;
    }
    flt-glass-pane {
      top: 44px !important;
      height: calc(100% - 44px) !important;
    }
    flt-glass-pane.no-bar {
      top: 0 !important;
      height: 100% !important;
    }
  </style>
</head>
<body>
  <div id="install-bar">
    <span id="bar-text">📲 Get the app for the best experience</span>
    <div style="display:flex;align-items:center;flex-shrink:0">
      <a id="install-btn" href="https://remedy-handbook.web.app/download" target="_blank" style="background:#F5C518;color:#2C1A00;border:none;padding:6px 14px;border-radius:20px;font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap;margin-left:8px;text-decoration:none;display:inline-block;">Install App</a>
      <button id="close-btn" onclick="closeBanner()">✕</button>
    </div>
  </div>

  <script src="flutter_bootstrap.js" async></script>

  <script>
    var deferredPrompt = null;
    var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    var isStandalone = window.matchMedia('(display-mode: standalone)').matches
                    || ('standalone' in navigator && navigator.standalone);
    var DISMISS_KEY = 'rhInstallDismiss';

    function shouldShowBanner() {
      if (isStandalone) return false;
      var until = localStorage.getItem(DISMISS_KEY);
      if (!until) return true;
      return Date.now() > parseInt(until);
    }

    function hideBanner() {
      document.getElementById('install-bar').classList.add('hidden');
      var panes = document.querySelectorAll('flt-glass-pane');
      panes.forEach(function(p) { p.classList.add('no-bar'); });
    }

    function closeBanner() {
      // Dismiss until midnight tonight
      var midnight = new Date();
      midnight.setHours(24, 0, 0, 0);
      localStorage.setItem(DISMISS_KEY, midnight.getTime());
      hideBanner();
    }

    // Hide if already installed or dismissed today
    if (!shouldShowBanner()) {
      hideBanner();
    }

    // iOS instructions
    if (isIOS && !isStandalone) {
      document.getElementById('bar-text').innerHTML =
        '📲 Tap <b>Share</b> → <b>Add to Home Screen</b>';
      document.getElementById('install-btn').style.display = 'none';
    }

    // Capture install prompt
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      deferredPrompt = e;
    });

    function handleInstall() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(function(result) {
          deferredPrompt = null;
          if (result.outcome === 'accepted') {
            localStorage.setItem(DISMISS_KEY, Date.now() + 365*24*60*60*1000);
            hideBanner();
          }
        });
      } else {
        // Show step-by-step visual guide
        var isAndroid = /android/i.test(navigator.userAgent);
        var msg = isAndroid
          ? '📲 Install in 2 steps:\n\n1. Tap the ⋮ menu (top right of Chrome)\n2. Tap "Add to Home Screen"\n\nThe app will install like a normal app!'
          : '📲 Install in 2 steps:\n\n1. Tap the Share button (Safari) or browser menu\n2. Tap "Add to Home Screen"\n\nThe app will appear on your home screen!';
        if (confirm(msg + '\n\nOpen browser menu now?')) {
          // Can't open menu programmatically, but confirm gives clear CTA
        }
      }
    }

    window.addEventListener('appinstalled', function() {
      localStorage.setItem(DISMISS_KEY, Date.now() + 365*24*60*60*1000);
      hideBanner();
    });

    // Register service worker for PWA install eligibility
    if ('serviceWorker' in navigator) {
      // service worker disabled
      navigator.serviceWorker.addEventListener('controllerchange', function() {
        window.location.reload();
      });
    }
  </script>
</body>
</html>
